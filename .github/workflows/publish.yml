name: Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build --if-present

      - name: Verify package contents
        run: |
          npm pack --dry-run --json > /tmp/npm-pack.json
          node scripts/verify-packlist.js /tmp/npm-pack.json

      - name: Check npm version
        id: npm-version
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"

          echo "package-spec=${package_spec}" >> "$GITHUB_OUTPUT"

          if npm view "${package_spec}" version > /tmp/npm-version.txt 2>&1; then
            echo "${package_spec} is already published."
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q "E404" /tmp/npm-version.txt; then
            echo "${package_spec} is not published yet."
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/npm-version.txt
            exit 1
          fi

      - name: Publish
        if: steps.npm-version.outputs.should-publish == 'true'
        run: npm publish --provenance
